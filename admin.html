<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>FERALMO.DE — LINK ADMIN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --background:#0d0d0d; --card:#1f1f1f; --bone:#e8e0d0;
    --primary:#8b1a1a; --primary-bright:#de5e5e; --green:#1e3d1e;
    --muted:#6b6b6b; --muted-fg:#999;
    --border:hsla(35,33%,86%,.08); --input:hsla(35,33%,86%,.15);
    --display:'Anton',Impact,sans-serif; --sans:'Inter',system-ui,sans-serif;
  }
  * { box-sizing:border-box; border-color:var(--border); }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--background); color:var(--bone); font:14px/1.5 var(--sans); -webkit-font-smoothing:antialiased; }
  h1,h2,h3 { font-family:var(--display); font-weight:400; text-transform:uppercase; letter-spacing:.05em; }
  header { position:sticky; top:0; z-index:50; border-bottom:1px solid var(--border); background:rgba(13,13,13,.95); backdrop-filter:blur(6px); }
  .bar { max-width:1100px; margin:0 auto; height:80px; display:flex; align-items:center; justify-content:space-between; padding:0 24px; }
  .bar h1 { font-size:28px; letter-spacing:.08em; margin:0; }
  .bar h1 span { color:var(--primary-bright); }
  .wrap { max-width:1100px; margin:0 auto; padding:24px 24px 96px; }
  h2 { font-size:15px; letter-spacing:.15em; color:var(--muted-fg); margin:40px 0 12px; }
  .center { min-height:70vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:24px; text-align:center; padding:0 16px; }
  .center h1 { font-size:32px; letter-spacing:.08em; margin:0; }
  .center p { font-family:var(--display); font-size:13px; letter-spacing:.15em; text-transform:uppercase; color:var(--muted-fg); max-width:520px; margin:0; }

  .btn, button, input {
    font-family:var(--display); font-size:13px; letter-spacing:.15em; text-transform:uppercase;
    background:none; color:var(--bone); border:1px solid var(--border); border-radius:0; padding:12px 20px;
    text-decoration:none; display:inline-block; cursor:pointer; transition:all .2s ease-in-out;
  }
  .btn:hover, button:hover { border-color:var(--primary); color:var(--primary-bright); }
  .btn.primary, button.primary { border-color:var(--primary); color:var(--primary-bright); }
  .btn.primary:hover, button.primary:hover { background:var(--primary); color:var(--bone); }
  button.ghost { border:none; padding:6px 8px; color:var(--muted-fg); font-size:12px; }
  button.ghost:hover { color:var(--primary-bright); }
  input {
    font-family:var(--sans); letter-spacing:normal; text-transform:none; cursor:text;
    background:var(--card); border:1px solid var(--input); padding:12px 14px;
  }
  input::placeholder { color:var(--muted); }
  input:focus { outline:none; border-color:var(--primary); }

  form.create { display:flex; gap:12px; flex-wrap:wrap; }
  form.create input[name=code] { width:150px; }
  form.create input[name=targetUrl] { flex:1; min-width:240px; }
  form.create input[name=description] { flex:1; min-width:180px; }

  table { width:100%; border-collapse:collapse; }
  th { text-align:left; font-family:var(--display); font-weight:400; font-size:11px; letter-spacing:.15em; text-transform:uppercase; color:var(--muted-fg); padding:10px 12px; border-bottom:1px solid var(--border); }
  td { padding:14px 12px; border-bottom:1px solid var(--border); vertical-align:middle; word-break:break-all; }
  tbody tr { border-left:0 solid transparent; transition:all .2s ease-in-out; }
  tbody tr.link:hover { border-left:4px solid var(--primary); background:linear-gradient(90deg,hsla(0,68%,32%,.1) 0%,transparent 100%); }
  td.num { text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
  a { color:var(--primary-bright); text-decoration:none; }
  a:hover { text-decoration:underline; }
  .code { font-family:var(--display); font-size:15px; letter-spacing:.08em; color:var(--bone); white-space:nowrap; }
  .code b { color:var(--primary-bright); }
  .dim { color:var(--muted-fg); font-size:12px; }
  .detail td { background:var(--card); padding:20px 24px; }
  .bar-row { display:flex; gap:10px; align-items:center; margin:3px 0; }
  .bar-row .lbl { width:92px; color:var(--muted-fg); font-size:11px; font-variant-numeric:tabular-nums; flex-shrink:0; }
  .bar-fill { background:var(--primary); height:12px; min-width:2px; }
  .stat-head { font-family:var(--display); font-size:11px; letter-spacing:.15em; text-transform:uppercase; color:var(--muted-fg); margin:16px 0 6px; }
  .qr-box { display:flex; gap:24px; align-items:flex-start; flex-wrap:wrap; }
  .qr-box img { width:220px; height:220px; image-rendering:pixelated; border:1px solid var(--border); }
  #msg { font-family:var(--display); font-size:12px; letter-spacing:.15em; text-transform:uppercase; color:var(--primary-bright); min-height:20px; margin:16px 0 0; }
  #signin-email { font-family:var(--sans); font-size:13px; color:var(--muted-fg); letter-spacing:normal; }
  .hdr-actions { display:flex; gap:16px; align-items:center; }
  #keybar { display:flex; gap:12px; max-width:520px; width:100%; }
  #keybar input { flex:1; }
</style>
</head>
<body>
<header><div class="bar">
  <h1>FERALMO<span>.DE</span> — LINK ADMIN</h1>
  <div class="hdr-actions" id="hdr" hidden>
    <span id="signin-email"></span>
    <a class="btn" id="logout" href="/auth/logout" hidden>LOG OUT</a>
  </div>
</div></header>

<div id="gate" class="center" hidden>
  <h1 id="gate-title">RESTRICTED AREA</h1>
  <p id="gate-msg">SIGN IN WITH AN AUTHORIZED GOOGLE ACCOUNT TO MANAGE LINKS.</p>
  <a class="btn primary" id="gate-login" href="/auth/login" hidden>SIGN IN WITH GOOGLE</a>
  <div id="keybar" hidden>
    <input id="key" type="password" placeholder="admin API key" autocomplete="off">
    <button class="primary" onclick="saveKey()">CONNECT</button>
  </div>
</div>

<div class="wrap" id="app" hidden>
  <h2>New link</h2>
  <form class="create" onsubmit="createLink(event)">
    <input name="code" placeholder="code (optional)" autocomplete="off">
    <input name="targetUrl" placeholder="https://getferalmode.com/…" required autocomplete="off">
    <input name="description" placeholder="description" autocomplete="off">
    <button class="primary">CREATE</button>
  </form>
  <div id="msg"></div>

  <h2>Links</h2>
  <table>
    <thead><tr><th>code</th><th>target</th><th>description</th><th style="text-align:right">clicks</th><th></th></tr></thead>
    <tbody id="links"></tbody>
  </table>

  <h2>Top misses <span class="dim" style="text-transform:none;letter-spacing:0">(unknown codes people hit)</span></h2>
  <div id="misses" class="dim">—</div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let KEY = "";
try { KEY = localStorage.getItem("feralmo-key") || ""; } catch {}

const GATE_ERRORS = {
  unauthorized: "THAT GOOGLE ACCOUNT ISN'T ON THE ALLOWED LIST FOR THIS ADMIN.",
  denied: "GOOGLE SIGN-IN WAS CANCELLED. TRY AGAIN.",
  state: "SIGN-IN STATE MISMATCH. TRY AGAIN.",
  exchange: "GOOGLE SIGN-IN FAILED. TRY AGAIN.",
};

function esc(s) { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; }

async function api(path, opts = {}) {
  const headers = { "Content-Type": "application/json", ...(opts.headers || {}) };
  if (KEY) headers["Authorization"] = "Bearer " + KEY;
  const res = await fetch(path, { ...opts, headers });
  if (res.status === 204) return null;
  if (res.headers.get("Content-Type")?.startsWith("image/")) {
    if (!res.ok) throw new Error("image fetch failed");
    return res.blob();
  }
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || res.statusText);
  return body;
}

function saveKey() {
  KEY = $("key").value.trim();
  try { localStorage.setItem("feralmo-key", KEY); } catch {}
  boot();
}

function showGate(me) {
  $("app").hidden = true;
  $("gate").hidden = false;
  const err = new URLSearchParams(location.search).get("error");
  if (err) { $("gate-title").textContent = "ACCESS DENIED"; $("gate-msg").textContent = GATE_ERRORS[err] || GATE_ERRORS.exchange; }
  $("gate-login").hidden = !me.oauth;
  $("keybar").hidden = me.oauth;
}

async function boot() {
  let me = { oauth: false, authenticated: false };
  try { me = await api("/api/me"); } catch {}
  try {
    const links = await api("/api/links"); // throws 401 when not authorized
    $("gate").hidden = true;
    $("app").hidden = false;
    $("hdr").hidden = false;
    $("signin-email").textContent = me.email || "API KEY";
    $("logout").hidden = !me.authenticated;
    renderLinks(links);
    renderMisses(await api("/api/misses"));
  } catch {
    showGate(me);
  }
}

function renderLinks(links) {
  $("links").innerHTML = links.length ? links.map(l => `
    <tr class="link">
      <td class="code"><b>/</b>${esc(l.code)} <button class="ghost" title="copy short link" onclick="copyLink('${esc(l.code)}')">COPY</button></td>
      <td><a href="${esc(l.targetUrl)}" target="_blank" rel="noopener">${esc(l.targetUrl)}</a></td>
      <td class="dim">${esc(l.description || "")}</td>
      <td class="num">${l.clicks}</td>
      <td class="num">
        <button class="ghost" onclick="toggleStats(this,'${esc(l.code)}')">STATS</button>
        <button class="ghost" onclick="toggleQR(this,'${esc(l.code)}')">QR</button>
        <button class="ghost" onclick="removeLink('${esc(l.code)}')">DELETE</button>
      </td>
    </tr>`).join("") : `<tr><td colspan="5" class="dim">NO LINKS YET</td></tr>`;
}

function renderMisses(misses) {
  $("misses").innerHTML = misses.length
    ? misses.map(m => `<div>/${esc(m.label)} — ${m.count}</div>`).join("")
    : "none";
}

function copyLink(code) { navigator.clipboard.writeText(location.origin + "/" + code); }

async function createLink(ev) {
  ev.preventDefault();
  const f = ev.target;
  $("msg").textContent = "";
  try {
    await api("/api/links", { method: "POST", body: JSON.stringify({
      code: f.code.value || null, targetUrl: f.targetUrl.value, description: f.description.value || null,
    })});
    f.reset();
    boot();
  } catch (e) { $("msg").textContent = e.message; }
}

async function removeLink(code) {
  if (!confirm(`DELETE /${code}? THE LINK STOPS WORKING; CLICK HISTORY IS KEPT.`)) return;
  try { await api("/api/links/" + code, { method: "DELETE" }); boot(); }
  catch (e) { $("msg").textContent = e.message; }
}

function closeDetail(row) {
  if (row.nextElementSibling?.classList.contains("detail")) { row.nextElementSibling.remove(); return true; }
  return false;
}

async function toggleStats(btn, code) {
  const row = btn.closest("tr");
  const wasStats = row.nextElementSibling?.dataset.kind === "stats";
  closeDetail(row);
  if (wasStats) return;
  try {
    const s = await api(`/api/links/${code}/stats`);
    const max = Math.max(1, ...s.clicksByDay.map(d => d.count));
    const days = s.clicksByDay.map(d =>
      `<div class="bar-row"><span class="lbl">${d.day}</span><span class="bar-fill" style="width:${(d.count/max)*220}px"></span> ${d.count}</div>`).join("")
      || '<span class="dim">NO CLICKS IN 30 DAYS</span>';
    const refs = s.topReferrers.map(r => `<div>${esc(r.label)} — ${r.count}</div>`).join("") || '<span class="dim">NONE</span>';
    insertDetail(row, "stats", `
      <div class="stat-head">${s.totalClicks} TOTAL CLICKS</div>
      <div class="stat-head">LAST 30 DAYS</div>${days}
      <div class="stat-head">TOP REFERRERS</div>${refs}`);
  } catch (e) { $("msg").textContent = e.message; }
}

async function toggleQR(btn, code) {
  const row = btn.closest("tr");
  const wasQR = row.nextElementSibling?.dataset.kind === "qr";
  closeDetail(row);
  if (wasQR) return;
  try {
    const blob = await api(`/api/links/${code}/qr.png`);
    const url = URL.createObjectURL(blob);
    insertDetail(row, "qr", `
      <div class="qr-box">
        <img src="${url}" alt="QR for /${esc(code)}">
        <div>
          <div class="stat-head">FERALMO.DE/${esc(code.toUpperCase())}</div>
          <p class="dim" style="max-width:340px">1024×1024 PNG, HIGH ERROR CORRECTION, LOGO CENTERED. SCAN TO TEST BEFORE PRINTING.</p>
          <a class="btn primary" href="${url}" download="feralmo-de-${esc(code)}.png">DOWNLOAD PNG</a>
        </div>
      </div>`);
  } catch (e) { $("msg").textContent = e.message; }
}

function insertDetail(row, kind, html) {
  const tr = document.createElement("tr");
  tr.className = "detail";
  tr.dataset.kind = kind;
  tr.innerHTML = `<td colspan="5">${html}</td>`;
  row.after(tr);
}

if (KEY) { try { $("key").value = KEY; } catch {} }
boot();
</script>
</body>
</html>
